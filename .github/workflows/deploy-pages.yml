name: Publish game to GitHub Pages

# Builds and publishes the Vite/PWA distribution after each change on main.
# The source of the Pages site remains gh-pages / (root).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: medgame1-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Validate content and licenses
        run: npm run validate
      - name: Build PWA
        run: npm run build
      - name: Ensure GitHub Pages publishes gh-pages (root)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          page_config="$(gh api "repos/${GITHUB_REPOSITORY}/pages")"
          branch="$(printf '%s' "$page_config" | jq -r '.source.branch // ""')"
          build_type="$(printf '%s' "$page_config" | jq -r '.build_type // ""')"
          echo "Pages source: branch=${branch}, build_type=${build_type}"
          if [[ "$branch" != "gh-pages" || "$build_type" == "workflow" ]]; then
            echo "::notice::Switching Pages publishing source to gh-pages/(root)."
            if ! gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=legacy -f 'source[branch]=gh-pages' -f 'source[path]=/'; then
              echo "::error::Cannot change Pages source with GITHUB_TOKEN. Open Settings > Pages and select Deploy from a branch > gh-pages > /(root)."
              exit 1
            fi
          fi
      - name: Publish dist to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          enable_jekyll: false
          commit_message: "deploy: build of ${{ github.sha }}"
      # A gh-pages push by GITHUB_TOKEN does not itself trigger a Pages build.
      # Explicit Pages API build request avoids a stale public site.
      - name: Request GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
